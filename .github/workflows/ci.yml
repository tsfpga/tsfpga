name: ci


# ------------------------------------------------------------------------------
on:
  # Run when a pull request is opened or updated.
  pull_request:
  # Add possibility of running manually from webpage.
  workflow_dispatch:
  push:
    # Run when a version tag is pushed.
    tags:
      - 'v*'
    # Run from main when a pull request is merged.
    branches:
      - main
  # Run nightly at 20:45 UTC.
  schedule:
  - cron: 45 20 * * *


# ------------------------------------------------------------------------------
# https://www.meziantou.net/how-to-cancel-github-workflows-when-pushing-new-commits-on-a-branch.htm
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

  # Cancel in-progress runs when a new workflow with the same group name is triggered.
  cancel-in-progress: true


# ------------------------------------------------------------------------------
jobs:

  # ------------------------------------------------------------------------------
  # Run all Python-based tests.

  pytest:
    name: Run Python tests
    strategy:
      matrix:
        os: ['ubuntu-latest', 'windows-latest', 'macos-latest']
        py: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.py }}
        cache: pip
        cache-dependency-path: tsfpga/requirements_develop.txt

    - name: Install Python packages
      run: |
        python3 -m pip install docutils GitPython PyYAML pytest rtoml tomli_w vunit-hdl==4.7.1

    - name: Clone dependency repos
      run: |
        git clone --depth 1 --single-branch --branch main https://github.com/hdl-registers/hdl-registers.git ../../hdl-registers/hdl-registers

    # Run only the UNIT tests on most Python versions in the matrix.
    # This is very fast (2-3 s).
    - name: Run unit tests
      if: matrix.os != 'ubuntu-latest' || matrix.py != '3.14'
      run: |
        python3 -m pytest --verbose tsfpga

    # On one Python version however, we run ALL the Python-based tests, which requires a few more
    # dependencies, and then we collect coverage from this run.
    - name: Install further Python packages
      if: matrix.os == 'ubuntu-latest' && matrix.py == '3.14'
      run: |
        python3 -m pip install \
          pybadges \
          pytest-cov \
          pytest-xdist \
          ruff

    # Run ALL tests, including unit, lint and functional ones.
    # The execution time goes from 1:13 -> 0:50 when two threads are used.
    - name: Run all tests
      if: matrix.os == 'ubuntu-latest' && matrix.py == '3.14'
      run: |
        python3 -m pytest \
          --verbose \
          --numprocesses 2 \
          --cov tsfpga \
          --cov-report xml:generated/python_coverage.xml \
          --cov-report html:generated/python_coverage_html \
          --ignore tests/functional/vivado \
          --ignore tests/functional/commercial_simulators \
          tsfpga \
          tests

    - name: Upload coverage artifacts
      if: matrix.os == 'ubuntu-latest' && matrix.py == '3.14'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage
        path: generated/python_coverage*


  # ------------------------------------------------------------------------------
  # Build HTML documentation for website.

  pytest_yosys:
    name: Run Yosys netlist build tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This image ships GHDL, Yosys and the 'ghdl-yosys-plugin', built against each other, which
    # is what the netlist build tests need. The plugin has no release artifacts and must be built
    # against the exact GHDL and Yosys it is used with, hence a container rather than actions.
    # Pinned for reproducibility, bump deliberately.
    container:
      image: ru551n/hdl-docker:1.2.0
      # The image's default user can not install packages.
      options: --user root
    steps:

    - name: Install prerequisites
      run: |
        apt-get update
        apt-get install -y --no-install-recommends git python3 python3-pip

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Note that 'requirements.txt' brings in 'hdl-registers', so no repo checkout of it is
    # needed here, unlike in the jobs that run the example simulation flow.
    - name: Install Python packages
      run: |
        python3 -m pip install --break-system-packages \
          -r tsfpga/requirements.txt \
          pytest

    - name: Locate the ghdl-yosys-plugin
      run: |
        echo "TSFPGA_GHDL_PLUGIN_PATH=$(yosys-config --datdir)/plugins/ghdl.so" >> "${GITHUB_ENV}"

    # The test suite skips itself when the tools are missing, which would make this job pass
    # while testing nothing. The whole point of it is a real GHDL + Yosys + plugin run, so check
    # that the tools are actually there before running.
    - name: Check that the tools are available
      run: |
        set -e
        command -v ghdl
        command -v yosys
        test -f "${TSFPGA_GHDL_PLUGIN_PATH}"
        yosys -m "${TSFPGA_GHDL_PLUGIN_PATH}" -p 'help ghdl' > /dev/null

    - name: Run Yosys netlist build tests
      run: |
        python3 -m pytest --verbose tests/functional/yosys

  build_doc:
    name: Build HTML documentation
    needs: pytest
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: tsfpga/requirements_develop.txt

    - name: Install Python packages
      run: |
        python3 -m pip install \
          black \
          GitPython \
          git+https://github.com/ProsePal/py-badge@6e137cf13d8453ff085aab90cf1535fb58a1785a \
          PyYAML \
          rtoml \
          setuptools \
          "sphinx<9" \
          sphinx_sitemap \
          sphinx-rtd-theme \
          sphinx-toolbox \
          sphinxcontrib-googleanalytics \
          sphinxext-opengraph \
          tomli_w \
          vunit-hdl==4.7.1

    - name: Clone dependency repos
      run: |
        git clone --depth 1 --single-branch --branch main \
          https://github.com/hdl-modules/hdl-modules.git ../../hdl-modules/hdl-modules
        git clone --depth 1 --single-branch --branch main \
          https://github.com/hdl-registers/hdl-registers.git ../../hdl-registers/hdl-registers

    - name: Download coverage artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: coverage
        path: generated

    - name: Run job
      run: |
        # Without tags, 'build_docs.py' can not find all git tags fo release history.
        # Note that 'fetch-tags: true' on the checkout actions did not work (2023-11-29).
        git fetch --all --tags
        python3 tools/build_docs.py

    - name: Configure Pages
      if: github.ref == 'refs/heads/main'
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    - name: Upload Pages Artifact
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: generated/sphinx_html


  # ------------------------------------------------------------------------------
  # Deploy the previously built HTML to GitHub Pages.

  deploy_pages:
    name: Deploy website to pages
    if: github.ref == 'refs/heads/main'
    # Only do deployment if everything else has passed.
    needs: [pytest, pytest_yosys, build_doc, simulate]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0


  # ------------------------------------------------------------------------------
  # Simulate some of the example code.

  simulate:
    name: Simulate
    runs-on: ubuntu-24.04
    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: tsfpga/requirements_develop.txt

    - name: Install Python packages
      run: |
        python3 -m pip install \
          GitPython \
          PyYAML \
          rtoml \
          tomli_w \
          vunit-hdl==4.7.1 \
          vunit-vivado

    - name: Setup GHDL
      uses: ghdl/setup-ghdl@75eff367dadc0cd06454a118db0b458d44fdc3c3 # v1.5.1

    - name: Clone dependency repos
      run: |
        git clone --depth 1 --single-branch --branch main \
          https://github.com/hdl-modules/hdl-modules.git ../../hdl-modules/hdl-modules
        git clone --depth 1 --single-branch --branch main \
          https://github.com/hdl-registers/hdl-registers.git ../../hdl-registers/hdl-registers

    - name: Run minimal simulation
      if: github.ref != 'refs/heads/main'
      run: |
        git fetch
        python3 tsfpga/examples/simulate.py --num-threads 2 --vivado-skip --vcs-minimal

    - name: Run full simulation
      if: github.ref == 'refs/heads/main'
      run: |
        python3 tsfpga/examples/simulate.py --num-threads 2 --vivado-skip --minimal


  # ------------------------------------------------------------------------------
  # Python release package to PyPI.

  release_pypi:
    name: PyPI release
    # Deploy new version when a version tag is pushed.
    if: github.ref_type == 'tag' && contains(github.ref_name, 'v')
    # Only do deployment if everything else has passed.
    needs: [pytest, pytest_yosys, build_doc, simulate]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tsfpga/requirements_develop.txt

      - name: Install Python packages
        run: |
          python3 -m pip install build

      - name: Build artifact
        run: python3 -m build

      - name: Deploy artifact
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # 1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}


  # ------------------------------------------------------------------------------
  # Test that the latest PyPI release can be installed.

  test_pypi:
    name: Test latest PyPI release
    # Run only on main branch.
    # Nightly or when triggered manually.
    # We don't want to waste CI time by running this to often.
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        py: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.py }}

      - name: Install latest release
        run: python3 -m pip install tsfpga

      - name: Run test script
        # 'cd' into the folder to guarantee that tsfpga from PyPI is used.
        run: cd tools && python3 pypi_test_script.py
